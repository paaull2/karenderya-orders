<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karenderya Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 780px; margin: 40px auto; padding: 0 16px; }
    button, input { font: inherit; padding: 8px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    .actions button { margin-right: 6px; }
    dialog { border: 1px solid #ccc; border-radius: 8px; width: min(400px, 90%); }
    dialog::backdrop { background: #0005; }
    dialog label { display: block; margin: 12px 0; }
    dialog input { width: 95%; }
    #message { color: #234e36; }
    .order-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    .order-row select { min-width: 180px; padding: 8px; }
    .order-row input { width: 85px; }
    section { margin-top: 28px; border-top: 1px solid #ddd; padding-top: 16px; }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <h1>Karenderya Menu</h1>
  <button id="add-food" type="button">+ Add food</button>
  <table>
    <thead><tr><th>Name</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="menu"></tbody>
  </table>
  <section>
    <h2>Create customer order</h2>
    <form id="order-form">
      <label>Customer name <input id="customer-name" maxlength="100" required></label>
      <div id="order-lines"></div>
      <button id="add-order-line" type="button">+ Add item</button>
      <p><strong>Total: <span id="order-total">₱0.00</span></strong></p>
      <button id="save-order" type="submit">Save order</button>
    </form>
  </section>
  <p id="message" role="status"></p>
  <dialog id="food-dialog">
    <form id="food-form">
      <h2 id="form-title">Add food</h2>
      <label>Name <input id="name" required maxlength="100"></label>
      <label>Price (₱) <input id="price" type="number" min="0.01" max="100000" step="0.01" required></label>
      <button type="button" id="close-food">Cancel</button>
      <button type="submit">Save</button>
    </form>
  </dialog>
  <dialog id="confirm-dialog">
    <h2>Confirm status change</h2>
    <p id="confirm-message"></p>
    <button id="cancel-status" type="button">No</button>
    <button id="confirm-status" type="button">Yes, proceed</button>
  </dialog>
</body>
</html>
