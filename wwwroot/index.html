<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karenderya Orders</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    input, button { font: inherit; padding: 8px; }
    li { padding: 6px 0; }
    #message { color: #a32a2a; }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <h1>Karenderya Menu</h1>
  <p>Starting version: list and add food items.</p>
  <ul id="menu"></ul>
  <h2>Add food</h2>
  <form id="food-form">
    <input id="name" placeholder="Food name" maxlength="100" required>
    <input id="price" type="number" placeholder="Price" min="0.01" max="100000" step="0.01" required>
    <button type="submit">Add</button>
  </form>
  <p id="message" role="status"></p>
</body>
</html>
