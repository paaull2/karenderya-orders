<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu | Karenderya</title><link rel="stylesheet" href="/style.css"><script src="/shared.js" defer></script><script src="/menu/page.js" defer></script></head><body><header><div class="top"><h1>Karenderya</h1><small>Cashier Management</small></div><nav><a href="/cashier/" >Cashier</a><a href="/menu/" aria-current="page">Menu</a><a href="/orders/" >Orders</a></nav></header><main><p id="message" role="status" aria-live="polite"></p><section><div class="section-heading"><div><h2>Menu Management</h2><p>Add or update food items. Inactive items stay in the records.</p></div><button id="add-food">+ Add Food Item</button></div><label class="search-label">Search food<input id="search" placeholder="Search by name"></label><table><thead><tr><th>Food</th><th>Price</th><th>Stock</th><th>Status</th><th>Created</th><th>Modified</th><th>Actions</th></tr></thead><tbody id="menu-rows"></tbody></table><dialog id="food-modal"><form id="food-form"><h3 id="modal-title">Add Food Item</h3><input type="hidden" id="food-id"><label>Name<input id="food-name" maxlength="100" required></label><label>Price (₱)<input id="food-price" type="number" step="0.01" min="0.01" max="100000" required></label><label id="initial-stock-label">Initial stock<input id="food-stock" type="number" step="1" min="0" value="0" required></label><div class="actions"><button type="button" class="secondary" id="close-modal">Cancel</button><button type="submit">Save</button></div></form></dialog><dialog id="stock-modal"><form id="stock-form"><h3 id="stock-title">Adjust stock</h3><p>Current stock: <strong id="current-stock">0</strong></p><label>New stock<input id="new-stock" type="number" min="0" step="1" required></label><p>Change: <strong id="stock-change">0</strong></p><div class="actions"><button type="button" class="secondary" id="close-stock">Cancel</button><button type="submit">Save stock</button></div></form></dialog></section></main></body></html>
